name: Build Android APK

on:
  push:
    branches:
      - master
    paths:
      - 'android/**'
      - 'android-src/MainActivity.kt'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Copy updated MainActivity.kt into android project
        run: |
          cp android-src/MainActivity.kt android/app/src/main/java/com/example/vistoriainicial/MainActivity.kt

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -Pandroid.enableJetifier=true
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Find APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Copy APK to root as VistoriaInicial.apk
        run: cp "${{ steps.apk.outputs.apk_path }}" VistoriaInicial.apk

      - name: Commit and push APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VistoriaInicial.apk
          git diff --staged --quiet || git commit -m "ci: atualiza APK compilado automaticamente [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
