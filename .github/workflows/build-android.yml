name: Build Android APK

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Copy updated MainActivity.kt into android project
        run: |
          cp android-src/MainActivity.kt android/app/src/main/java/com/example/vistoriainicial/MainActivity.kt

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Copy web assets to Android
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/
          cp dashboard.html android/app/src/main/assets/
          cp app.js android/app/src/main/assets/
          cp styles.css android/app/src/main/assets/
          cp login.js android/app/src/main/assets/ || true
          cp sw.js android/app/src/main/assets/ || true
          cp version.json android/app/src/main/assets/ || true
          cp manifest.webmanifest android/app/src/main/assets/ || true
          cp logo.png android/app/src/main/assets/ || true
          cp icon-192.png android/app/src/main/assets/ || true
          cp icon-512.png android/app/src/main/assets/ || true

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Find APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Copy APK to root as VistoriaInicial.apk
        run: cp "${{ steps.apk.outputs.apk_path }}" VistoriaInicial.apk

      - name: Commit and push APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VistoriaInicial.apk
          git diff --staged --quiet || git commit -m "ci: atualiza APK compilado automaticamente [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
