<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <title>Login - Gestão de Vistorias</title>
    <script>
      (function() {
        try {
          if (window.AndroidInterface || window.location.protocol === 'file:') {
            localStorage.setItem('authenticated', 'true');
          }
        } catch(e) {}
      })();
    </script>
    <link rel="stylesheet" href="styles.css?v=200" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <main class="login-page">
      <section class="login-card">
        <p class="eyebrow">Gestão de Vistorias</p>
        <h1>Acesse o painel</h1>
        <p>Use seu usuário para entrar e gerenciar as vistorias.</p>

        <form id="loginForm" class="login-form">
          <label>
            Usuário
            <input id="usernameInput" type="text" required placeholder="" />
          </label>
          <label>
            Senha
            <input id="passwordInput" type="password" required placeholder="" />
          </label>
          <button class="primary-btn" type="submit">Entrar</button>
          <p id="loginError" class="login-error" hidden></p>
        </form>

        <form id="registerForm" class="login-form" style="display: none;">
          <label>
            Novo Usuário
            <input id="newUsernameInput" type="text" required placeholder="Digite o usuário" />
          </label>
          <label>
            Nova Senha
            <input id="newPasswordInput" type="password" required placeholder="Digite a senha" />
          </label>
          <button class="primary-btn" type="submit">Cadastrar</button>
          <p id="registerError" class="login-error" hidden></p>
          <p id="registerSuccess" style="color: #10b981; font-size: 0.875rem; text-align: center; margin-top: 10px;" hidden>Cadastro realizado com sucesso! Faça login.</p>
        </form>

        <div class="login-hint" id="toggleLoginView" style="text-align: center; margin-top: 18px;">
          <a href="#" id="showRegisterLink" style="color: #2563eb; font-weight: 600; text-decoration: none;">Novo cadastro</a>
        </div>

        <div style="margin-top: 24px; padding-top: 18px; border-top: 1.5px dashed #e2e8f0; text-align: center; display: flex; flex-direction: column; gap: 8px;">
          <button id="importBackupButton" class="ghost-btn" style="padding: 10px 14px; font-size: 0.85rem; border: 1px solid #bfdbfe; color: #1d4ed8; background: #eff6ff; font-weight: 700; width: 100%; border-radius: 12px; cursor: pointer;">
            📥 Importar Backup (Arquivo .json)
          </button>
          <button id="importPasteBackupLoginBtn" class="ghost-btn" type="button" style="padding: 10px 14px; font-size: 0.85rem; border: 1px solid #ddd6fe; color: #7c3aed; background: #f5f3ff; font-weight: 700; width: 100%; border-radius: 12px; cursor: pointer;">
            📋 Colar Código do Backup (Texto)
          </button>
          <input type="file" id="backupFileInput" accept=".json" style="display: none;" />
        </div>
        <div class="login-hint" id="toggleRegisterView" style="display: none; text-align: center; margin-top: 18px;">
          <a href="#" id="showLoginLink" style="color: #2563eb; font-weight: 600; text-decoration: none;">Entrar</a>
        </div>

      </section>
    </main>

    <!-- BACKUP PASTE IMPORT LOGIN MODAL -->
    <div id="backupPasteImportLoginModal" class="photo-modal-overlay" style="display: none;">
      <div class="photo-modal" style="max-width: 500px; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.4);">
        <h3 style="margin-top: 0; color: #1e293b; text-align: center;">📥 Restaurar Backup por Texto</h3>
        <p style="font-size: 0.85rem; color: #4b5563; margin-top: 8px; margin-bottom: 12px; text-align: center;">
          Cole abaixo o código do backup. O sistema irá recuperar automaticamente os dados:
        </p>

        <textarea id="pasteBackupLoginTextarea" placeholder="Cole o código do backup aqui..." style="width: 100%; height: 160px; font-family: monospace; font-size: 0.75rem; padding: 10px; border-radius: 10px; border: 1.5px solid #94a3b8; background: #ffffff; resize: vertical; box-sizing: border-box;"></textarea>

        <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 14px;">
          <button id="submitPasteBackupLoginBtn" class="primary-btn" type="button" style="padding: 12px; font-weight: 700; background: #16a34a; color: white; border: none; border-radius: 12px; cursor: pointer; width: 100%;">
            ✅ Restaurar Dados Agora
          </button>
        </div>

        <div class="photo-modal-actions" style="margin-top: 16px;">
          <button class="cancel-btn" type="button" onclick="closePasteImportLoginModal()" style="width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #cbd5e1; background: #f1f5f9; cursor: pointer;">Cancelar</button>
        </div>
      </div>
    </div>

    <script src="login.js?v=200"></script>
  </body>
</html>
