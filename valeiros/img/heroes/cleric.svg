      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1b1b2f" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="border_cleric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80e5ff"/>
