  <text x="100" y="102" font-size="48" text-anchor="middle" dominant-baseline="middle">✝️</text>
  
  <rect x="25" y="148" width="150" height="32" rx="6" fill="rgba(10,10,15,0.85)" stroke="#80e5ff" stroke-width="1.5"/>
  
  <text x="100" y="169" font-family="'Cinzel', Georgia, serif" font-size="13" font-weight="bold" fill="#80e5ff" text-anchor="middle" letter-spacing="1.5">CLÉRIGO</text>
