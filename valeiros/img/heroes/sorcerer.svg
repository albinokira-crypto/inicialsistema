  <text x="100" y="102" font-size="48" text-anchor="middle" dominant-baseline="middle">🔮</text>
  
  <rect x="25" y="148" width="150" height="32" rx="6" fill="rgba(10,10,15,0.85)" stroke="#f48fb1" stroke-width="1.5"/>
  
