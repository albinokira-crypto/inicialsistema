<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg_paladin" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#262208" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="border_paladin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff275"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#bfa100"/>
    </linearGradient>
    <filter id="glow_paladin" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#fff275" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <rect width="200" height="200" fill="url(#bg_paladin)"/>
  
  <rect x="10" y="10" width="180" height="180" rx="16" fill="none" stroke="url(#border_paladin)" stroke-width="4" filter="url(#glow_paladin)"/>
  <rect x="16" y="16" width="168" height="168" rx="10" fill="none" stroke="#fff275" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="6 3"/>
  
  <circle cx="100" cy="85" r="52" fill="rgba(0,0,0,0.45)" stroke="#fff275" stroke-width="2.5"/>
  <circle cx="100" cy="85" r="45" fill="#bfa100" fill-opacity="0.2"/>
  
  <text x="100" y="102" font-size="48" text-anchor="middle" dominant-baseline="middle">🛡️</text>
  
  <rect x="25" y="148" width="150" height="32" rx="6" fill="rgba(10,10,15,0.85)" stroke="#fff275" stroke-width="1.5"/>
  
  <text x="100" y="169" font-family="'Cinzel', Georgia, serif" font-size="13" font-weight="bold" fill="#fff275" text-anchor="middle" letter-spacing="1.5">PALADINO</text>
</svg>