<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg_wizard" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#bb86fc" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1a0f2e" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="border_wizard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d7b8ff"/>
      <stop offset="50%" stop-color="#bb86fc"/>
      <stop offset="100%" stop-color="#6200ea"/>
    </linearGradient>
    <filter id="glow_wizard" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#d7b8ff" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <rect width="200" height="200" fill="url(#bg_wizard)"/>
  
  <rect x="10" y="10" width="180" height="180" rx="16" fill="none" stroke="url(#border_wizard)" stroke-width="4" filter="url(#glow_wizard)"/>
  <rect x="16" y="16" width="168" height="168" rx="10" fill="none" stroke="#d7b8ff" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="6 3"/>
  
  <circle cx="100" cy="85" r="52" fill="rgba(0,0,0,0.45)" stroke="#d7b8ff" stroke-width="2.5"/>
  <circle cx="100" cy="85" r="45" fill="#6200ea" fill-opacity="0.2"/>
  
  <text x="100" y="102" font-size="48" text-anchor="middle" dominant-baseline="middle">🧙‍♂️</text>
  
  <rect x="25" y="148" width="150" height="32" rx="6" fill="rgba(10,10,15,0.85)" stroke="#d7b8ff" stroke-width="1.5"/>
  
  <text x="100" y="169" font-family="'Cinzel', Georgia, serif" font-size="13" font-weight="bold" fill="#d7b8ff" text-anchor="middle" letter-spacing="1.5">MAGO</text>
</svg>